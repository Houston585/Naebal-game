
name: Unpack original Labean game

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract original archive
        run: |
          test -f labean.zip
          mkdir -p /tmp/labean-archive
          unzip -q labean.zip -d /tmp/labean-archive
          test -d /tmp/labean-archive/labean
          cp -a /tmp/labean-archive/labean/. .
          rm -f labean.zip

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import original Labean project"
            git push
          fi
